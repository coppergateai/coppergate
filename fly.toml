# Coppergate worker — TASK033 staging
# Deploy from repo root: fly deploy

app = "coppergate-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NODE_ENV = "production"
  GITHUB_DELIVERY_MODE = "http"
  SANDBOX_MODE = "local"
  # Prefer workspace BYOK / OPENAI_API_KEY. OpenHands scaffold stub is disabled.
  # CONTENDER_HARNESS = "native_openai"
  APP_URL = "https://www.coppergate.ai"

[processes]
  worker = "pnpm start"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"
  processes = ["worker"]
