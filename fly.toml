# Coppergate worker — TASK033 staging
# Deploy from repo root: fly deploy

app = "coppergate-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NODE_ENV = "production"
  GITHUB_DELIVERY_MODE = "http"
  # Agent/repo commands run in gVisor containers (network none) on a Docker
  # daemon inside this Machine. The entrypoint starts dockerd as root, builds the
  # sandbox image onto the /data volume, then drops to the coppergate user.
  # SEC-037: production refuses local mode and the runc fallback.
  SANDBOX_MODE = "docker"
  START_DOCKERD = "1"
  DOCKER_DATA_ROOT = "/data/docker"
  # Prefer workspace BYOK / OPENAI_API_KEY. OpenHands scaffold stub is disabled.
  # CONTENDER_HARNESS = "native_openai"
  APP_URL = "https://www.coppergate.ai"
  # RT-040 — Community OPP verify after Accept (also set as Fly secret).
  OPP_API_URL = "https://api.opp.coppergate.ai"
  # Design scout: use Playwright-bundled Chromium (see Dockerfile.worker).
  PW_USE_BUNDLED = "1"
  PLAYWRIGHT_BROWSERS_PATH = "/ms-playwright"

# Docker data-root (images + layers). One volume per Machine.
[mounts]
  source = "coppergate_worker_docker"
  destination = "/data"
  initial_size = "20gb"

[processes]
  worker = "pnpm start"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"
  processes = ["worker"]
