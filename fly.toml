# Coppergate worker — TASK033 staging
# Deploy from repo root: fly deploy

app = "coppergate-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NODE_ENV = "production"
  GITHUB_DELIVERY_MODE = "http"
  # SEC-037: production refuses SANDBOX_MODE=local without ALLOW_LOCAL_SANDBOX=1.
  # This worker still runs agent commands on the Machine itself (break-glass ack);
  # moving it to SANDBOX_MODE=docker is pending — see docs/SECURITY_PRODUCTION.md.
  SANDBOX_MODE = "local"
  ALLOW_LOCAL_SANDBOX = "1"
  # Prefer workspace BYOK / OPENAI_API_KEY. OpenHands scaffold stub is disabled.
  # CONTENDER_HARNESS = "native_openai"
  APP_URL = "https://www.coppergate.ai"
  # RT-040 — Community OPP verify after Accept (also set as Fly secret).
  OPP_API_URL = "https://api.opp.coppergate.ai"
  # Design scout: use Playwright-bundled Chromium (see Dockerfile.worker).
  PW_USE_BUNDLED = "1"
  PLAYWRIGHT_BROWSERS_PATH = "/ms-playwright"

[processes]
  worker = "pnpm start"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"
  processes = ["worker"]
