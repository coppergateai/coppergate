# Self-host stack: Postgres + web + worker
# Usage:
#   cp .env.selfhost.example .env.selfhost
#   # edit APP_URL, secrets, GitHub and/or GitLab credentials
#   docker compose -f docker-compose.selfhost.yml --env-file .env.selfhost up -d --build
#
# See docs/SELF_HOST.md

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coppergate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coppergate}
      POSTGRES_DB: coppergate
    volumes:
      - coppergate_selfhost_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coppergate -d coppergate"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.selfhost
    environment:
      DATABASE_URL: postgresql://coppergate:${POSTGRES_PASSWORD:-coppergate}@postgres:5432/coppergate
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: ["pnpm", "--filter", "@coppergate/db", "migrate"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - .env.selfhost
    environment:
      DATABASE_URL: postgresql://coppergate:${POSTGRES_PASSWORD:-coppergate}@postgres:5432/coppergate
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.selfhost
    environment:
      DATABASE_URL: postgresql://coppergate:${POSTGRES_PASSWORD:-coppergate}@postgres:5432/coppergate
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  coppergate_selfhost_pg:
